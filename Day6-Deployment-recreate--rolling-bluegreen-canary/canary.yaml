apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-stable
  namespace: default
  labels:
    app: myapp
    version: stable

spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp
      version: stable

  template:
    metadata:
      labels:
        app: myapp
        version: stable

    spec:
      containers:
        - name: myapp
          image: nginx:1.25.3
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-canary
  namespace: default
  labels:
    app: myapp
    version: canary

spec:
  replicas: 1

  selector:
    matchLabels:
      app: myapp
      version: canary

  template:
    metadata:
      labels:
        app: myapp
        version: canary

    spec:
      containers:
        - name: myapp
          image: nginx:1.27
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: default

spec:
  selector:
    app: myapp

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
