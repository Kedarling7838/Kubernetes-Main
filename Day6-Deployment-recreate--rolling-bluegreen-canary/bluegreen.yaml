apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
  namespace: default
  labels:
    app: myapp
    version: blue

spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp
      version: blue

  template:
    metadata:
      labels:
        app: myapp
        version: blue

    spec:
      containers:
        - name: myapp
          image: nginx:1.25.3
          ports:
            - containerPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
  namespace: default
  labels:
    app: myapp
    version: green

spec:
  replicas: 4

  selector:
    matchLabels:
      app: myapp
      version: green

  template:
    metadata:
      labels:
        app: myapp
        version: green

    spec:
      containers:
        - name: myapp
          image: nginx:1.27
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  namespace: default

spec:
  selector:
    app: myapp
    version: blue

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
